name: Flutter CI & Release

on:
  push:
    branches: [ "main" ]

jobs:
  build_and_release:
    name: Build and Release
    runs-on: ubuntu-latest
    
    # Required for creating releases
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze || true

      - name: Build Web
        run: flutter build web --release

      - name: Archive Web Build
        run: |
          cd build/web
          zip -r ../../web-build.zip .
          cd ../..

      - name: Build APK
        run: flutter build apk --release

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "web-build.zip,build/app/outputs/flutter-apk/app-release.apk"
          tag: "v1.0.${{ github.run_number }}"
          name: "Release v1.0.${{ github.run_number }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: "Automated standard release covering the latest functional Flutter build. Includes both Android APK and pre-compiled Web assets."
